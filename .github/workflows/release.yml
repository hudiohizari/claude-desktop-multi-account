name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.2.0
        required: true

permissions:
  contents: write
  pull-requests: write   # the cask bump opens a PR

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    env:
      # Mapped here because the secrets context is not dependable inside a step's
      # `if`, while env is.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # VERSION is the source of truth, so a tag that disagrees with it is a
      # mistake worth failing on rather than shipping a mislabelled build.
      - name: Resolve and check version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          number="${tag#v}"
          file=$(tr -d '[:space:]' < VERSION)
          if [ "$number" != "$file" ]; then
            echo "::error::tag $tag does not match VERSION ($file)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Test before shipping
        run: swift test

      # build.sh stamps CFBundleShortVersionString and CFBundleVersion from VERSION.
      - name: Build the app bundle
        run: ./build.sh

      # Signing and notarizing is optional: without the secrets the release still
      # goes out ad-hoc signed, and users right click, Open once. With them, the app
      # installs without any Gatekeeper prompt.
      #
      # Secrets to set: MACOS_CERTIFICATE (base64 of a Developer ID Application .p12),
      # MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY (for example
      # "Developer ID Application: Your Name (TEAMID)"), NOTARY_APPLE_ID,
      # NOTARY_TEAM_ID, NOTARY_PASSWORD (an app specific password).
      - name: Sign with Developer ID
        id: signing
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "build/Claude Clones.app"
          codesign --verify --strict --deep "build/Claude Clones.app"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign
        if: ${{ steps.signing.outputs.signed != 'true' }}
        run: codesign --force --sign - "build/Claude Clones.app"

      # ditto keeps the bundle's symlinks and permissions, which zip flattens.
      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Claude Clones.app" \
            "ClaudeClones-${{ steps.version.outputs.tag }}.zip"

      # Notarizing the zip, then stapling the app inside the bundle, so a fresh
      # download opens with no warning at all.
      - name: Notarize and staple
        if: ${{ steps.signing.outputs.signed == 'true' && env.NOTARY_PASSWORD != '' }}
        run: |
          cd build
          xcrun notarytool submit "ClaudeClones-${{ steps.version.outputs.tag }}.zip" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "Claude Clones.app"
          rm "ClaudeClones-${{ steps.version.outputs.tag }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "Claude Clones.app" \
            "ClaudeClones-${{ steps.version.outputs.tag }}.zip"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Compute the cask checksum
        id: checksum
        run: |
          sum=$(shasum -a 256 "build/ClaudeClones-${{ steps.version.outputs.tag }}.zip" \
            | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${NOTARIZED:-0}" = "1" ]; then
            note="Signed and notarized, so it opens normally."
          else
            note="Signed ad-hoc and not notarized, so the first launch needs right click, Open. Building it yourself with ./build.sh --install avoids that."
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            "build/ClaudeClones-${{ steps.version.outputs.tag }}.zip" \
            --title "Claude Clones ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes "$note

          sha256: \`${{ steps.checksum.outputs.sha256 }}\`"

      # Opens a PR rather than pushing to the default branch, so this still works
      # with pull requests required on main.
      - name: Bump the cask
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cask=Casks/claude-clones.rb
          sed -i '' "s/^  version \".*\"$/  version \"${{ steps.version.outputs.number }}\"/" "$cask"
          sed -i '' "s/^  sha256 .*$/  sha256 \"${{ steps.checksum.outputs.sha256 }}\"/" "$cask"
          if [ -z "$(git status --porcelain "$cask")" ]; then
            echo "cask already current"
            exit 0
          fi
          branch="cask/${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$cask"
          git commit -m "chore: cask ${{ steps.version.outputs.tag }}"
          git push origin "$branch"
          # Needs Settings, Actions, General, "Allow GitHub Actions to create and
          # approve pull requests". Without it the branch is still pushed and the
          # PR can be opened by hand.
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore: cask ${{ steps.version.outputs.tag }}" \
            --body "Version and checksum for ${{ steps.version.outputs.tag }}, opened by the release workflow."
